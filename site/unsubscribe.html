<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unsubscribe — LinkUp</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="tokens.css?v=20261121b" />
<link rel="stylesheet" href="site.css?v=20261121b" />
</head>
<body>
<main class="notice-wrap">
  <div class="notice-card">
  <a class="logo" href="/"><span class="logo-mark"></span>LinkUp</a>
  <h1 id="title">One moment…</h1>
  <p id="msg" role="status">Taking you off that list.</p>
  <button class="btn ghost sm" type="button" id="retry" hidden>Try again</button>
  </div>
</main>
<script src="config.js"></script>
<script src="api.js?v=20261121b"></script>
<script>
  const token = new URLSearchParams(location.search).get('t');
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');

  document.getElementById('retry').onclick = () => location.reload();

  (async () => {
    if (!token || !API.configured()) {
      title.textContent = 'That link looks wrong';
      msg.textContent = 'Try the unsubscribe link at the bottom of the email again.';
      return;
    }
    try {
      const ok = await API.rpc('unsubscribe', { p_token: token }, true);
      title.textContent = ok ? "You're unsubscribed" : 'That link looks wrong';
      msg.textContent = ok
        ? "You won't get any more emails from that list. Nothing else changes."
        : 'Use the unsubscribe link from the latest email.';
    } catch {
      title.textContent = "That didn't work";
      msg.textContent = 'Try again or reply to the email to ask to be removed.';
      document.getElementById('retry').hidden = false;
    }
  })();
</script>
</body>
</html>
