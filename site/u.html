<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LinkUp</title>
<meta name="theme-color" content="#111629" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="tokens.css?v=20261121" />
<link rel="stylesheet" href="linkup.css?v=20261121" />
</head>
<body>

<div class="bg"></div>

<div class="welcome" id="welcome" hidden>
  <video id="welcomeVideo" playsinline preload="metadata"></video>
  <div class="welcome-cover" id="welcomeCover">
    <img class="welcome-avatar" id="welcomeAvatar" alt="" hidden />
    <button class="play" id="playBtn" aria-label="Play welcome video"></button>
    <p id="welcomeName"></p>
  </div>
  <button class="skip" id="skipBtn">Skip</button>
</div>

<p class="missing" id="loading" role="status">Loading this page…</p>
<main class="page" id="page"></main>
<div class="missing" id="missing" hidden>
  <h1>Nothing here yet</h1>
  <p>This address isn't taken, or the page behind it hasn't been published.</p>
  <a href="/">Make one of your own</a>
</div>

<script src="config.js"></script>
<script src="api.js?v=20261121"></script>
<script src="linkup.js?v=20261121"></script>
<script>
  const slug = (new URLSearchParams(location.search).get('u')
             || location.pathname.replace(/^\/+|\/+$/g, '').split('/').pop() || '')
             .toLowerCase();

  const page    = document.getElementById('page');
  const welcome = document.getElementById('welcome');
  const video   = document.getElementById('welcomeVideo');
  const cover   = document.getElementById('welcomeCover');

  function reveal() {
    welcome.classList.add('gone');
    page.classList.add('show');
    try { video.pause(); } catch {}
    setTimeout(() => { welcome.hidden = true; video.removeAttribute('src'); video.load(); }, 800);
  }

  function notFound() {
    document.getElementById('loading').hidden = true;
    page.hidden = true;
    document.getElementById('missing').hidden = false;
  }

  // The public RPC uses renderer keys. Accept older snake_case payloads too.
  function toView(raw) {
    let quiz = raw.quiz;
    if (typeof quiz === 'string') {
      try { quiz = JSON.parse(quiz); } catch { quiz = null; }
    }
    return {
      ...raw, quiz: quiz || {},
      mode: raw.mode || (quiz?.questions?.length && quiz.enabled !== false ? 'quiz' : 'hub'),
      avatar: raw.avatar ?? raw.avatar_url ?? '',
      backgroundVideo: raw.backgroundVideo ?? raw.background_video_url ?? '',
      backgroundImage: raw.backgroundImage ?? raw.background_image_url ?? '',
      welcomeVideo: raw.welcomeVideo ?? raw.welcome_video_url ?? '',
      bubbleStyle: raw.bubbleStyle ?? raw.bubble_style ?? 'glass',
      captureEnabled: raw.captureEnabled ?? raw.capture_enabled ?? false,
      captureHeading: raw.captureHeading ?? raw.capture_heading ?? '',
    };
  }

  (async () => {
    if (!API.configured() || !slug || slug === 'u.html') return notFound();

    let raw = null;
    try { raw = await API.publicProfile(slug); } catch {
      notFound();
      const missing = document.getElementById('missing');
      missing.querySelector('h1').textContent = 'Could not load this page';
      missing.querySelector('p').textContent = 'Check your connection and try again.';
      const retry = missing.querySelector('a');
      retry.textContent = 'Try again';
      retry.href = location.href;
      return;
    }
    if (!raw) return notFound();

    document.getElementById('loading').hidden = true;
    const p = toView(raw);
    document.title = p.name ? `${p.name} — LinkUp` : 'LinkUp';
    LinkUp.render(p);

    if (raw.badge === false) {
      page.dataset.hideBadge = '1';
      document.querySelector('.foot')?.remove();
    }

    page.addEventListener('click', (e) => {
      const hit = e.target.closest('.quiz-option, .hub-item, .quiz-cta[href]');
      if (!hit || !raw.id) return;
      const label = (hit.dataset.label || hit.textContent.trim()).slice(0, 80) || 'tap';
      API.recordTap(raw.id, label);
    });

    const form = document.querySelector('.capture');
    if (form) {
      form.onsubmit = async e => {
        e.preventDefault();
        const input = form.querySelector('input[name=email]');
        const btn = form.querySelector('button');
        const status = form.parentElement.querySelector('.capture-status');
        status.textContent = '';
        btn.disabled = true;
        try {
          await API.joinList(raw.id, input.value.trim());
          form.closest('.capture-wrap').innerHTML =
            `<p class="capture-note" role="status">Thanks — you're on the list.</p>`;
        } catch {
          btn.disabled = false;
          status.textContent = "That didn't send. Try again in a moment.";
        }
      };
    }

    if (p.welcomeVideo) {
      welcome.hidden = false;
      video.src = p.welcomeVideo;
      document.getElementById('welcomeName').textContent =
        p.name ? `A quick hello from ${p.name}` : '';
      if (p.avatar) {
        const a = document.getElementById('welcomeAvatar');
        a.src = p.avatar; a.hidden = false;
      }
      document.getElementById('playBtn').onclick = () => {
        cover.classList.add('gone');
        video.play().catch(reveal);
      };
      document.getElementById('skipBtn').onclick = reveal;
      video.onended = reveal;
      video.onerror = reveal;
    } else {
      page.classList.add('show');
    }
  })();
</script>
</body>
</html>
