<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LinkUp</title>
<meta name="theme-color" content="#111629" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="linkup.css" />
<style>
  .missing {
    position: relative; z-index: 2; min-height: 100dvh;
    display: grid; place-content: center; justify-items: center; gap: 16px;
    text-align: center; padding: 32px; color: #fff;
  }
  .missing h1 { font-family: var(--serif); font-size: 30px; letter-spacing: -.02em; }
  .missing p { opacity: .8; max-width: 32ch; line-height: 1.5; }
  .missing a {
    margin-top: 8px; text-decoration: none; padding: 12px 22px; border-radius: var(--r-pill);
    background: rgba(255,255,255,.16); font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="welcome" id="welcome" hidden>
  <video id="welcomeVideo" playsinline preload="metadata"></video>
  <div class="welcome-cover" id="welcomeCover">
    <img class="welcome-avatar" id="welcomeAvatar" alt="" hidden />
    <button class="play" id="playBtn" aria-label="Play welcome video"></button>
    <p id="welcomeName"></p>
  </div>
  <button class="skip" id="skipBtn">Skip</button>
</div>

<main class="page" id="page"></main>
<div class="missing" id="missing" hidden>
  <h1>Nothing here yet</h1>
  <p>This address isn't taken, or the page behind it hasn't been published.</p>
  <a href="/">Make one of your own</a>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="linkup.js"></script>
<script>
  /* The address is the path: /becca, or ?u=becca when opened as a plain file.
     Netlify rewrites /:slug onto this page — see netlify.toml. */
  const slug = (new URLSearchParams(location.search).get('u')
             || location.pathname.replace(/^\/+|\/+$/g, '').split('/').pop() || '')
             .toLowerCase();

  const page    = document.getElementById('page');
  const welcome = document.getElementById('welcome');
  const video   = document.getElementById('welcomeVideo');
  const cover   = document.getElementById('welcomeCover');

  function reveal() {
    welcome.classList.add('gone');
    page.classList.add('show');
    try { video.pause(); } catch {}
    setTimeout(() => { welcome.hidden = true; video.removeAttribute('src'); video.load(); }, 800);
  }

  function notFound() {
    page.hidden = true;
    document.getElementById('missing').hidden = false;
  }

  (async () => {
    if (!API.configured() || !slug || slug === 'u.html') return notFound();

    let p = null;
    try { p = await API.publicProfile(slug); } catch { return notFound(); }
    if (!p) return notFound();

    document.title = p.name ? `${p.name} — LinkUp` : 'LinkUp';
    LinkUp.render(p);
    LinkUp.liven();

    // The badge is a Basic-plan thing; the database decides, not the browser.
    if (!p.badge) document.querySelector('.foot')?.remove();

    /* Count the tap, then let the link do what it was going to do. keepalive
       means the request survives the page being navigated away from, so no
       delay is added for the sake of a number. */
    document.querySelectorAll('.bubble').forEach(a => {
      a.addEventListener('click', () => {
        API.recordTap(p.id, a.querySelector('span')?.textContent?.trim() || 'Untitled');
      });
    });

    // Joining a list writes a real row, so the demo handler is replaced.
    const form = document.querySelector('.capture');
    if (form) {
      form.onsubmit = async (e) => {
        e.preventDefault();
        const input = form.querySelector('input[name=email]');
        const btn = form.querySelector('button');
        btn.disabled = true;
        try {
          await API.joinList(p.id, input.value.trim());
          form.closest('.capture-wrap').innerHTML =
            `<p class="capture-note">Thanks — you're on the list.</p>`;
        } catch {
          btn.disabled = false;
          alert("That didn't send. Try again in a moment.");
        }
      };
    }

    if (p.welcomeVideo) {
      welcome.hidden = false;
      video.src = p.welcomeVideo;
      document.getElementById('welcomeName').textContent =
        p.name ? `A quick hello from ${p.name}` : '';
      if (p.avatar) {
        const a = document.getElementById('welcomeAvatar');
        a.src = p.avatar; a.hidden = false;
      }
      document.getElementById('playBtn').onclick = () => {
        cover.classList.add('gone');
        video.play().catch(reveal);
      };
      document.getElementById('skipBtn').onclick = reveal;
      video.onended = reveal;
      video.onerror = reveal;
    } else {
      page.classList.add('show');
    }
  })();
</script>
</body>
</html>
